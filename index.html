
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="This is a sample HTML page">
    <meta name="keywords" content="HTML, Sample, Page">
    <meta name="author" content="Your Name">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 6.2</title>
    <style>
        body {
            background-color: coral;
            font-family:Georgia, 'Times New Roman', Times, serif;
            color: rgb(7, 7, 7);
            text-align: center;
            padding: 20px;
            border: 3px solid black; 
            margin: 30px;           
        }

        .titleContainer {
            font-size: 40px;
            padding: 20px;
            padding-bottom: 30px;
            border: 2px solid darkgreen;
            border-radius: 5px;
            margin: 20px;
        } 

        .arrayContainer {
            background-color: greenyellow;
            padding: 10px;
            border: 2px solid darkgreen;
            border-radius: 5px;
            margin: 20px;
            color: black;
            font-size: 50px;
        }

        .arrayContainer h2 {
            font-size: 50px;
        }

    #displayBooks {
            color: rgb(164, 23, 23);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 50px;
        }

        button:hover {
            background-color: rgb(200, 255, 0);
        }

/* General styling for all buttons */
    button {
    padding: 15px 25px;
    border: 2px solid black;
    border-radius: 5px;
    cursor: pointer;
    font-size: 20px;
    font-family: Georgia, 'Times New Roman', Times, serif;
    margin: 10px;
}

/* Button hover effect */
    button:hover {
    background-color: rgb(200, 255, 0);
    transform: scale(1.05);
}        

.removingBookContainer, .enterbook, .shiftButton, .unshiftButton, .spliceButton, .forEachButton {
            margin: 20px;
            border-radius: 5px;
            padding: 30px;
        }

        .enterbook {
            background-color: rgb(120, 217, 235);
            border: 2px solid darkgreen;
        }

        .removingBookContainer {
            background-color: rgb(164, 57, 226);
            border: 2px solid darkgreen;
        }
        .shiftButton {
            background-color: rgb(72, 231, 119);
            border: 2px solid darkgreen;
        }

        .unshiftButton {
            background-color: rgb(129, 62, 163);
            border: 2px solid darkgreen;
        }   

        .spliceButton {
            background-color: rgb(255, 0, 0);
            border: 2px solid darkgreen;
        }

        .forEachButton {
            background-color: rgb(238, 190, 58);
            border: 2px solid darkgreen;
        }

        input {
            padding: 20px;
            padding-left: 100px;
            color: plum;
            background-color:rgb(12, 11, 11);
            border: 2px solid darkgreen;
            border-radius: 5px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            width: 350px;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 30px;
        }


    .unshiftButton button {
    background-color: rgb(203, 133, 36);
    }

    .enterbook button {
    background-color: rgb(176, 62, 20);
  }

    .shiftButton button {
    background-color: rgb(175, 160, 155);
    }

   .removingBookContainer button {
   background-color: rgb(164, 57, 226);
  }

   .spliceButton button {
   background-color: rgb(55, 255, 0);
 }

   .forEachButton button {
    background-color: rgb(33, 25, 198);
   }
    </style>
</head>

<body>

<section id="mainSection">
    <div class="titleContainer">
    <h1 style="text-decoration: underline;">Create A Mini Project To Practice JavaScript Array Methods.</h1>
    </div>

    <!-- Button for Displaying the array of books -->
    <div class="arrayContainer">
        <h2>Book Titles:</h2>
        <div id="displayBooks"></div>
        <button class="displayBooks" onclick="displayBooks()">Display Books</button>
    </div>

    <!-- Container for adding a book to the beginning -->
    <div class="unshiftButton">
        <h2>Add a book to the beginning:</h2>
        <input type="text" id="unshiftInput" placeholder="Enter a book name"></br>
        <button onclick="unshiftButton()">Add to Beginning</button>
    </div>

     <!-- Container for adding a book -->
    <div class="enterbook">
        <h2>Add a book to the end:</h2>
        <input type="text" id="addButton" placeholder="Enter a book name"></br>
        <button onclick="addElement()">Add Book</button>
    </div>
 
        <!-- Container for removing the first book -->
    <div class="shiftButton">
        <h2>Remove the first book:</h2>
        <button onclick="shiftButton()">Remove First Book</button>
    </div>

    <!-- Container for removing the last book -->
    <div class="removingBookContainer">
        <h2>Remove the last book:</h2>
        <button onclick="removeButton()">Remove Last Book</button>
    </div>

    <!-- Container for replacing a book -->
    <div class="spliceButton">
        <h2>Replace a book:</h2>
        <button onclick="spliceButton()">Replace Book</button>
    </div>

    <!-- Display using forEach -->
    <div class="forEachButton">
        <h2>Display books using forEach:</h2>
        <button onclick="forEachButton()">Display Using forEach</button>
    </div>
</section>

<script src="script.js" defer></script>

</body>
</html>
